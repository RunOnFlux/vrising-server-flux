name: Test, build and publish

# There is no upstream image to follow: the Dockerfile builds on ubuntu:22.04 with a PINNED
# Wine (see the Dockerfile for why). So a push to main publishes. Publishing :latest DOES reach
# running servers: FluxOS's image update service checks every app's tag every six hours and
# soft-redeploys onto a new image, which restarts the server with no warning in game. So a
# scheduled run publishes only when there is something to apply (.github/ci/needs-rebuild.sh),
# since even a rebuild of unchanged inputs gets a new digest.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays: a check, and a build only when needs-rebuild.sh finds something to apply: an urgent
    # security update, commits on main (touching the image inputs) the published image does not have,
    # or, on the first Monday of the month, anything else.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: runonflux/vrising-server-flux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: |
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py

      # Pinned, so "shellcheck is clean on my machine" means the same thing here.
      - name: Shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -x scripts/*.sh tests/*.sh .github/ci/*.sh

      - name: Unit tests
        run: ./tests/test-flux.sh

  # Is there anything to publish? Always yes for a push or a manual run; for the scheduled run, see
  # .github/ci/needs-rebuild.sh. Also resolves the base digest the build pins.
  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      base: ${{ steps.check.outputs.base }}
      base_digest: ${{ steps.check.outputs.base_digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The check compares the published image's revision label with this history.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - id: check
        run: |
          base="$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)"
          echo "base=${base}" >>"$GITHUB_OUTPUT"
          .github/ci/needs-rebuild.sh "${IMAGE_NAME}" "${base}"

  build:
    needs: [test, check]
    # A pull request gets the tests and nothing else: it must not publish. A scheduled run with
    # nothing new stops at the check.
    if: github.event_name != 'pull_request' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FLUX_IMAGE_VERSION=${{ github.sha }}
            BASE_IMAGE=${{ needs.check.outputs.base }}@${{ needs.check.outputs.base_digest }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ needs.check.outputs.base }}
            org.opencontainers.image.base.digest=${{ needs.check.outputs.base_digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must still run the game's tooling it was built for: Wine 10 with fsync, its wine64
      # launcher, SteamCMD, and the scripts. A missing launcher is exactly how an unpinned build
      # broke every start (exit 127), and it costs nothing to check here.
      - name: Smoke test the published image
        run: |
          docker run --rm --entrypoint bash "${IMAGE_NAME}:${{ github.sha }}" -c '
            set -e
            wine --version | grep -q "^wine-10\."
            wine --version | grep -q "Fsync"
            command -v wine64 steamcmd Xvfb wineserver python3 >/dev/null
            python3 /opt/flux/flux-rcon.py >/dev/null 2>&1 || [ $? = 64 ]
            bash -n /opt/flux/flux-entrypoint.sh
            # flux.log is on a container path outside every volume, and the banner is printed
            out="$(bash -c "source /opt/flux/flux-lib.sh; flux_banner \"V Rising\"")"
            grep -q "V Rising server image by FluxCloud - https://runonflux.com" <<<"${out}"
            grep -q "Host this and 30+ other games" /var/log/flux/flux.log
          '
